<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>yt-js-shell</title>
  <script>
    // 对齐 FreeTubeAndroid 的 CDP Emulation.setDeviceMetricsOverride：
    // 让 BotGuard VM 看到与 context(os=Windows/10.0 browser=Chrome/126) 一致的桌面 Chrome 指纹。
    // 安卓 WebView 默认上报 mobile=true / platform=Linux aarch64 / 空 plugins / 设备物理像素，
    // 与 context 声称的桌面 Windows/Chrome 自相矛盾 → token 的 engagement proof 被 YouTube
    // 判为"环境不一致"而拒签 DASH 流(adaptive 全无 url)。此 polyfill 在 document 解析时运行，
    // 早于任何 evaluateJavascript 注入的 interpreter，故 VM 读到的是覆盖后的桌面指纹。
    (function () {
      var D = {
        platform: 'Win32',
        oscpu: 'Windows NT 10.0; Win64; x64',
        vendor: 'Google Inc.',
        appVersion: '5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
        deviceMemory: 8,
        hardwareConcurrency: 8,
        maxTouchPoints: 0,
        language: 'en-US',
        languages: ['en-US', 'en'],
        width: 1920, height: 1080,
        availWidth: 1920, availHeight: 1040,
        colorDepth: 24,
        dpr: 1,
        outerWidth: 1920, outerHeight: 1080,
        innerWidth: 1920, innerHeight: 937,
        screenX: 0, screenY: 0,
        webdriver: false,
        uaData: {
          brands: [
            { brand: 'Not/A)Brand', version: '8' },
            { brand: 'Chromium', version: '126' },
            { brand: 'Google Chrome', version: '126' }
          ],
          mobile: false,
          platform: 'Windows',
          platformVersion: '10.0.0',
          architecture: 'x86',
          bitness: '64',
          fullVersionList: [
            { brand: 'Not/A)Brand', version: '8.0.0.0' },
            { brand: 'Chromium', version: '126.0.6478.127' },
            { brand: 'Google Chrome', version: '126.0.6478.127' }
          ]
        }
      };

      function define(obj, prop, value) {
        try {
          Object.defineProperty(obj, prop, { get: function () { return value; }, configurable: true });
        } catch (e) {}
      }

      // navigator 只读属性
      define(navigator, 'platform', D.platform);
      define(navigator, 'oscpu', D.oscpu);
      define(navigator, 'vendor', D.vendor);
      define(navigator, 'appVersion', D.appVersion);
      define(navigator, 'deviceMemory', D.deviceMemory);
      define(navigator, 'hardwareConcurrency', D.hardwareConcurrency);
      define(navigator, 'maxTouchPoints', D.maxTouchPoints);
      define(navigator, 'language', D.language);
      define(navigator, 'languages', D.languages);
      define(navigator, 'webdriver', D.webdriver);

      // userAgentData（Chrome 新指纹，安卓默认 mobile=true/platform=Android）
      try {
        Object.defineProperty(navigator, 'userAgentData', {
          get: function () {
            return {
              brands: D.uaData.brands,
              mobile: D.uaData.mobile,
              platform: D.uaData.platform,
              platformVersion: D.uaData.platformVersion,
              architecture: D.uaData.architecture,
              bitness: D.uaData.bitness,
              fullVersionList: D.uaData.fullVersionList,
              getHighEntropyValues: function () { return Promise.resolve(D.uaData); },
              toJSON: function () { return { brands: D.uaData.brands, mobile: D.uaData.mobile, platform: D.uaData.platform }; }
            };
          },
          configurable: true
        });
      } catch (e) {}

      // 桌面 Chrome 的 plugins（安卓 WebView 为空，是强指纹信号）
      var pluginNames = ['PDF Viewer', 'Chrome PDF Viewer', 'Chromium PDF Viewer', 'Microsoft Edge PDF Viewer', 'WebKit built-in PDF'];
      var fakePlugins = [];
      pluginNames.forEach(function (name, i) {
        var p = { name: name, filename: name + '.pdf', description: name, length: 1 };
        p[0] = { type: 'application/pdf', suffixes: 'pdf', description: name };
        fakePlugins.push(p);
      });
      fakePlugins.length = pluginNames.length;
      fakePlugins.item = function (i) { return fakePlugins[i] || null; };
      fakePlugins.namedItem = function (n) { for (var i = 0; i < fakePlugins.length; i++) if (fakePlugins[i].name === n) return fakePlugins[i]; return null; };
      try { Object.defineProperty(navigator, 'plugins', { get: function () { return fakePlugins; }, configurable: true }); } catch (e) {}
      try { Object.defineProperty(navigator, 'mimeTypes', { get: function () { return fakePlugins; }, configurable: true }); } catch (e) {}

      // 桌面 Chrome 无 navigator.connection（安卓有）
      try { Object.defineProperty(navigator, 'connection', { get: function () { return undefined; }, configurable: true }); } catch (e) {}

      // screen（安卓默认设备物理像素/竖屏）
      define(screen, 'width', D.width);
      define(screen, 'height', D.height);
      define(screen, 'availWidth', D.availWidth);
      define(screen, 'availHeight', D.availHeight);
      define(screen, 'colorDepth', D.colorDepth);
      define(screen, 'pixelDepth', D.colorDepth);

      // window
      define(window, 'devicePixelRatio', D.dpr);
      define(window, 'outerWidth', D.outerWidth);
      define(window, 'outerHeight', D.outerHeight);
      define(window, 'innerWidth', D.innerWidth);
      define(window, 'innerHeight', D.innerHeight);
      define(window, 'screenX', D.screenX);
      define(window, 'screenY', D.screenY);
      define(window, 'screenLeft', D.screenX);
      define(window, 'screenTop', D.screenY);
    })();
  </script>
</head>
<body>
  <!--
    隐藏 WebView JS 引擎宿主页。
    仅作为 evaluateJavascript 的稳定执行上下文，本身不承载业务逻辑。
    Kotlin 侧通过 WebView.evaluateJavascript 注入 n 解密 / BotGuard 的 JS。
    注意:由 YoutubeJsExecutor 以 loadDataWithBaseURL("https://www.youtube.com/", …) 加载，
    document origin = youtube.com —— 对齐 FreeTubeAndroid,BotGuard VM 需此才能通过反爬
    环境校验并产生 minter(webPoSignalOutput)。勿改回 file:// 基址,否则 PMD:Undefined 复现。
    头部内联脚本为桌面指纹 polyfill(对齐 FreeTubeAndroid 的 setDeviceMetricsOverride)，
    勿删——VM 需读到与 context 一致的桌面环境才能产出被信任的 token。
  -->
</body>
</html>
